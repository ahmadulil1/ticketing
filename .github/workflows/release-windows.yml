# Build installer Windows (NSIS) + upload ke GitHub Release.
#
# Cara pakai:
#   1. Set Secrets di repo (Settings > Secrets and variables > Actions):
#        TAURI_SIGNING_PRIVATE_KEY        -> isi file private key Tauri
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD -> password key (kosongkan kalau tak ada)
#      Semua secret WAJIB ada, kalau tidak build gagal di langkah signing.
#      Kalau key hilang & bikin baru: ganti juga "pubkey" di
#      desktop/src-tauri/tauri.conf.json (Public key dari key baru).
#   2. Jalankan: Actions > "Rilis Windows" > Run workflow, isi versi.
#      (atau push tag: git tag v1.1.0 && git push origin v1.1.0)
#   3. Setelah asset terupload, di server jalankan:
#        node scripts/release.cjs --version 1.1.0 --from-github
#      -> itu yang menulis /downloads/latest.json (manifest updater).

name: Rilis Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis, mis. 1.1.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Build NSIS + signature
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python (untuk maturin/pytauri)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hitung versi
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}"
            if ($v.StartsWith("v")) { $v = $v.Substring(1) }
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versi tidak valid: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versi: $v"

      - name: Samakan versi di 3 file
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
        working-directory: desktop
        run: |
          node -e "
            const fs=require('fs');
            const v=process.env.VER;
            const patch=(f,fn)=>{let s=fs.readFileSync(f,'utf8');s=fn(s);fs.writeFileSync(f,s);};
            patch('package.json',s=>s.replace(/\"version\":\s*\"[^\"]+\"/, '\"version\": \"'+v+'\"'));
            patch('src-tauri/tauri.conf.json',s=>s.replace(/\"version\":\s*\"[^\"]+\"/, '\"version\": \"'+v+'\"'));
            patch('src-tauri/Cargo.toml',s=>s.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"'+v+'\"'));
          "
          Select-String -Path package.json -Pattern '\"version\"'
          Select-String -Path src-tauri/tauri.conf.json -Pattern '\"version\"'
          Select-String -Path src-tauri/Cargo.toml -Pattern '^version'

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri (NSIS + signature)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Cek hasil + signature
        shell: pwsh
        run: |
          $nsis = "desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsis -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Tidak ada .exe di $nsis" }
          if (-not (Test-Path "$($exe.FullName).sig")) {
            Write-Warning "Tidak ada .sig - rilis ini tak bisa auto-update. Cek secret signing key."
          }
          Get-ChildItem $nsis | Select-Object Name, Length

      - name: Upload ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ticketing Desktop ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Rilis Ticketing Desktop ${{ steps.ver.outputs.version }} (Windows).

            Setelah ini, jalankan di server:
            `node scripts/release.cjs --version ${{ steps.ver.outputs.version }} --from-github`
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Ringkasan
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          Write-Host ""
          Write-Host "Selesai build Windows v$($env:VER)"
          Write-Host "Langkah server:"
          Write-Host "  node scripts/release.cjs --version $env:VER --from-github"
