[package]
name = "ticketing-desktop"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# ponytail: default-features off — seluruh versi zip <9.0.3 di-yank crates.io,
# fitur "zip" (ekstraksi bundle macOS/Linux) tak bisa di-resolve.
# Windows (NSIS/MSI) tidak butuh fitur ini. Re-enable kalau zip sudah un-yank.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gethostname = "0.5"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }

# Remote desktop: screen capture (screencapture CLI) + input injection (CGEventPost)
core-graphics = "0.23"
base64 = "0.22"
# Identitas device (device_id + device_secret) disimpan di store.bin (shared antar window)
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi"
] }
