server {
    listen 80;
    server_name _;

    # Security headers (HTTPS/HSTS ditambahkan setelah TLS aktif)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6M;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
    }



    # Frontend
    location / {
        root /var/www/ticketing/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Updater manifest (desktop auto-update)
    location = /downloads/latest.json {
        root /var/www/ticketing;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # File tetap satu; nama unduhan mengikuti versi yang diminta halaman install.
    location = /downloads/Ticketing-setup.exe {
        root /var/www/ticketing;
        default_type application/octet-stream;
        set $installer_name "Ticketing-setup.exe";
        if ($arg_v ~ "^[0-9]+\.[0-9]+\.[0-9]+$") {
            set $installer_name "Ticketing_${arg_v}_x64-setup.exe";
        }
        add_header Content-Disposition 'attachment; filename="$installer_name"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Installer desktop app (one-click download)
    location /downloads/ {
        root /var/www/ticketing;
        autoindex off;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        # Artefak updater (Ticketing.app.tar.gz) berubah isinya tiap rilis
        # dengan nama file sama. Tanpa no-store, Cloudflare menahan versi lama
        # di edge (max-age 4 jam) -> updater dapat file usang & signature
        # tidak cocok -> update ditolak.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff;
    }

    # Short link ke installer terbaru
    # absolute_redirect off -> Location dikirim relatif ("/downloads/...").
    # Kalau absolute, nginx bikin "http://..." (TLS di terminate Cloudflare,
    # bukan nginx) lalu browser blokir redirect sebagai mixed content ->
    # user tak bisa download lewat link /download.
    location = /download {
        absolute_redirect off;
        return 302 /downloads/Ticketing-setup.exe;
    }

    # Assets hashed - cache lama aman
    location /assets/ {
        root /var/www/ticketing/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
